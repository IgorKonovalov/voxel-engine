# Seeded tree for scripts/check-test-tiers.mjs; scripts/fixtures/README.md names the findings.
[test-groups]
lavapipe = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'binary(/^gpu_/)'
test-group = 'lavapipe'

[[profile.default.overrides]]
filter = 'test(=slow_one)'
slow-timeout = { period = "600s" }

[profile.quick]
default-filter = 'not binary(/^gpu_/) and not (test(=slow_one))'

[profile.gpu]
default-filter = 'binary(/^gpu_/) and not (test(=slow_one))'

[profile.gate]
default-filter = 'not (test(=slow_one))'

[profile.soak]
default-filter = '(test(=slow_one))'

# SEEDED: CI's Windows arm drifted from the quick tier's filter.
[profile.ci-windows]
default-filter = 'not (test(=slow_one))'
