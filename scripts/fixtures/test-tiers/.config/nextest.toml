# Seeded tree for scripts/check-test-tiers.mjs; scripts/fixtures/README.md names the findings.
[test-groups]
lavapipe = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'binary(/^gpu_/)'
test-group = 'lavapipe'

[profile.quick]
default-filter = 'not binary(/^gpu_/)'

[profile.gpu]
default-filter = 'binary(/^gpu_/)'

[profile.gate]

[profile.soak]
default-filter = 'not test(/(^|::)reading::/)'

[profile.full]
default-filter = 'not test(/(^|::)reading::/)'

# SEEDED: CI's Windows arm drifted from the quick tier's filter.
[profile.ci-windows]
default-filter = 'all()'
