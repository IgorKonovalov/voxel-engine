# cargo-about's configuration for the tester build's THIRD-PARTY-NOTICES.txt (Plan 0068). The
# accepted licences are deny.toml's; the targets are the two archives'. The release workflow
# installs cargo-about pinned (`cargo install --locked --features cli cargo-about@0.9.3`; the
# binary sits behind the `cli` feature) and appends DXC's notice (dist/DXC-LICENSE.txt) to the
# Windows archive's copy (ADR-0035).
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "CC0-1.0",
    "BSL-1.0",
    "NCSA",
]
targets = ["x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
ignore-dev-dependencies = true
ignore-build-dependencies = false
# The workspace's own crates are under LICENSE-MIT and LICENSE-APACHE, shipped beside.
private = { ignore = true }
