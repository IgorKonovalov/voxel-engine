# Supply-chain gate. Enforced in CI via `cargo deny check`.
#
# Security and unsound advisories are always errors. A specific finding is
# silenced only via an explicit, reasoned `advisories.ignore` entry.

[graph]
# Exactly the platforms we ship (ADR-0001): Linux and Windows desktop.
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "x86_64-pc-windows-msvc" },
]

[advisories]
ignore = []

[licenses]
# Permissive licenses compatible with shipping under MIT OR Apache-2.0.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "CC0-1.0",
    "BSL-1.0",
    # DXC, statically linked into Windows builds through mach-dxcompiler-rs (below).
    "NCSA",
]

# mach-dxcompiler-rs declares only its own MIT, but its build script downloads and links a
# prebuilt static DXC (Microsoft's DirectXShaderCompiler), which is under the University of
# Illinois/NCSA Open Source License. Shipping a Windows binary owes DXC's notice (ADR-0035).
[[licenses.clarify]]
crate = "mach-dxcompiler-rs"
expression = "MIT AND NCSA"
# The hash is cargo-deny's (XxHash32 of the file with line endings normalised); a changed
# LICENSE stops the clarification applying and the crate falls back to its own MIT.
license-files = [{ path = "LICENSE", hash = 0xc9d1a063 }]

[bans]
multiple-versions = "warn"
# A wildcard version is not a pin. Path dependencies inside the workspace carry
# no version and are allowed; a registry dependency without one is not.
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
