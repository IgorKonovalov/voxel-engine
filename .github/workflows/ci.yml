# Build, tests, doctests, clippy, fmt and the supply-chain gate on Linux and
# Windows for every push. GPU tests run on a software Vulkan adapter (Mesa's
# lavapipe on Linux); golden baselines are blessed on lavapipe, so image
# comparisons assert on the Linux arm (VXE_REQUIRE_SOFTWARE_ADAPTER=1 fails
# them if lavapipe is missing) and print-and-skip elsewhere. Real-vendor
# GPU checks stay manual (docs/nfr.md).
name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # A hung step fails the job instead of holding the runner for six hours. Warm, the Linux
    # job took 13 min and the Windows one 26 (CI run 41886647253); the cap leaves room for a
    # cold cache. The gate step has its own cap below, and nextest's ci profile kills a single
    # test at 600 s.
    timeout-minutes: 90
    # The lavapipe the Linux arm builds (the steps after the build packages): Mesa's release
    # tarball, pinned by its sha256, and the meson options that build lavapipe alone.
    env:
      MESA_VERSION: 26.2.6
      MESA_SHA256: b9436b3e1a8be76fbd4823dc884f90596ab7c6ac5e1867a305e66ffccfb31a92
      MESA_OPTIONS: >-
        -Dbuildtype=debugoptimized -Db_ndebug=true -Dvulkan-drivers=swrast
        -Dgallium-drivers=llvmpipe -Dplatforms= -Dopengl=false -Dglx=disabled -Degl=disabled
        -Dgbm=disabled -Dgles1=disabled -Dgles2=disabled -Dllvm=enabled -Dshared-llvm=enabled
        -Dvideo-codecs= -Dvalgrind=disabled -Dlibunwind=disabled -Dbuild-tests=false
    steps:
      - uses: actions/checkout@v5
      # winit's Wayland and X11 backends need the xkbcommon and wayland headers;
      # mesa-vulkan-drivers carries lavapipe, without which wgpu finds no adapter;
      # libasound2-dev is the ALSA library cpal's Linux backend links; libudev-dev is the
      # udev library gilrs links for the fly-through's gamepad; vulkan-tools' vulkaninfo names the
      # driver the Vulkan loader picks.
      - name: Install the Linux build packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libxkbcommon-dev libwayland-dev mesa-vulkan-drivers libasound2-dev libudev-dev \
            vulkan-tools
      # The runner's own lavapipe (Mesa 26.0.8) dies with SIGSEGV in the light pass, and Mesa
      # 26.2.6 on the same LLVM 21 passes (docs/backlog.md, "llvmpipe SIGSEGV on CI's Ubuntu since
      # Plan 0057 Phase 7"). So the Linux arm builds lavapipe alone from Mesa's release tarball,
      # checked against the sha256 above, against the runner's own LLVM 21, with meson and its
      # Python tools pinned on PyPI and every other package from the runner's archive. The
      # install is cached by the tarball's hash, the options and the runner image, so a warm run
      # skips the build. These steps come out once the runner image ships Mesa 26.2 or later.
      - name: Key the lavapipe build
        if: runner.os == 'Linux'
        id: lavapipe-key
        run: |
          sum=$(printf '%s %s' "$MESA_SHA256" "$MESA_OPTIONS" | sha256sum | cut -c1-16)
          echo "key=lavapipe-${ImageOS:-linux}-${ImageVersion:-unknown}-$MESA_VERSION-$sum" >> "$GITHUB_OUTPUT"
      - name: Restore the built lavapipe
        if: runner.os == 'Linux'
        id: lavapipe-cache
        uses: actions/cache@v4
        with:
          path: ~/mesa-lvp
          key: ${{ steps.lavapipe-key.outputs.key }}
      - name: Build lavapipe from Mesa's release tarball
        if: runner.os == 'Linux' && steps.lavapipe-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get install -y --no-install-recommends \
            python3-venv bison flex glslang-tools llvm-21-dev libdrm-dev libzstd-dev zlib1g-dev \
            libexpat1-dev
          work=$(mktemp -d)
          curl -fsSL -o "$work/mesa.tar.xz" "https://mesa.freedesktop.org/archive/mesa-$MESA_VERSION.tar.xz"
          echo "$MESA_SHA256  $work/mesa.tar.xz" | sha256sum -c -
          tar -xJf "$work/mesa.tar.xz" -C "$work"
          python3 -m venv "$work/venv"
          "$work/venv/bin/pip" install --quiet \
            meson==1.9.1 ninja==1.13.0 mako==1.3.10 packaging==25.0 pyyaml==6.0.3
          printf "[binaries]\nllvm-config = '/usr/lib/llvm-21/bin/llvm-config'\n" > "$work/native.ini"
          start=$(date +%s)
          # shellcheck disable=SC2086 # the options split into meson's arguments
          PATH="$work/venv/bin:$PATH" meson setup "$work/build" "$work/mesa-$MESA_VERSION" \
            --native-file "$work/native.ini" --prefix "$HOME/mesa-lvp" --libdir lib $MESA_OPTIONS
          PATH="$work/venv/bin:$PATH" ninja -C "$work/build" install
          echo "lavapipe built in $(( $(date +%s) - start )) s"
          rm -rf "$work"
      # Every later step loads the built lavapipe alone; the job fails unless the loader reports
      # its version.
      - name: Use the built lavapipe
        if: runner.os == 'Linux'
        run: |
          icd="$HOME/mesa-lvp/share/vulkan/icd.d/lvp_icd.x86_64.json"
          echo "VK_DRIVER_FILES=$icd" >> "$GITHUB_ENV"
          echo "VK_ICD_FILENAMES=$icd" >> "$GITHUB_ENV"
          export VK_DRIVER_FILES="$icd" VK_ICD_FILENAMES="$icd"
          vulkaninfo --summary | grep -E 'deviceName|driverInfo'
          vulkaninfo --summary | grep -q "driverInfo *= Mesa $MESA_VERSION "
      # rustup on the runner auto-installs the toolchain pinned in rust-toolchain.toml.
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      # The logic components (ADR-0010) are built for wasm32-wasip2 before the tests that
      # load them; the host's tests fail, not skip, when one is missing.
      - run: rustup target add wasm32-wasip2
      - name: Build the logic components
        shell: bash
        run: scripts/build-guests.sh
      - run: cargo build --workspace
      # Pipeline creation per compute pass (docs/nfr.md section 7). Windows runs DX12 on WARP
      # twice: FXC forced through WGPU_DX12_COMPILER, then the default (static DXC,
      # ADR-0035). The fly-through's size is the debug binary the build step above produced;
      # the static DXC library's size is what the feature adds to it at most.
      - name: Pipeline times on DX12 under FXC and the default compiler
        if: runner.os == 'Windows'
        shell: bash
        run: |
          WGPU_DX12_COMPILER=fxc cargo run -p vxe-render --release --example pipeline_times
          cargo run -p vxe-render --release --example pipeline_times
          echo "target/debug/flythrough.exe: $(wc -c < target/debug/flythrough.exe) bytes"
          find target/debug/build -path '*mach-dxcompiler-rs-*' -name '*.lib' -exec wc -c {} + || true
      - name: Pipeline times on lavapipe
        if: runner.os == 'Linux'
        run: cargo run -p vxe-render --release --example pipeline_times
      # DIAGNOSTIC, out with the fix for the WARP hang (docs/backlog.md, "`vxe-render::exposure`
      # hangs on WARP since Plan 0057 Phase 7"): the debug fly-through the shutdown test runs,
      # headless on WARP, 3 frames as that test runs them. CI run 42470428595 placed the hang:
      # frame 0 never finishes while the preload runs. These runs place it among frame 0's
      # preload dispatches: `VXE_DIAG_SPLIT_FRAME0=1` submits the passes before the preload,
      # the preload's args pass, its sweep and the light pass one at a time, waiting for the GPU
      # and logging a `diag: frame 0 split: <stage> done` line after each, and
      # `VXE_DIAG_PRELOAD` drops the sweep (`skip-sweep`) or runs the plain light pass in place
      # of `shade_preload` (`shade`). The preload-off run is the control that finishes. Each
      # run is killed past 180 s and its stdout and stderr printed; the `diag:` lines are timed
      # from the process start. The step never fails the job.
      - name: Headless fly-through on WARP (diagnostic)
        if: runner.os == 'Windows'
        continue-on-error: true
        timeout-minutes: 25
        shell: pwsh
        run: |
          $exe = "target\debug\flythrough.exe"
          $env:RUST_LOG = "warn,flythrough=info"
          $runs = @(
            @{ name = "split"; split = "1"; preload = ""; args = "--headless --frames 3 --render 64x36" },
            @{ name = "split, no sweep"; split = "1"; preload = "skip-sweep"; args = "--headless --frames 3 --render 64x36" },
            @{ name = "split, shade in place of shade_preload"; split = "1"; preload = "shade"; args = "--headless --frames 3 --render 64x36" },
            @{ name = "no split, shade in place of shade_preload"; split = ""; preload = "shade"; args = "--headless --frames 3 --render 64x36" },
            @{ name = "preload off (control)"; split = ""; preload = ""; args = "--headless --frames 3 --render 64x36 --preload off" }
          )
          foreach ($r in $runs) {
            Write-Host "=== WARP diagnostic: $($r.name): flythrough $($r.args)"
            if ($r.split) { $env:VXE_DIAG_SPLIT_FRAME0 = $r.split } else { Remove-Item Env:VXE_DIAG_SPLIT_FRAME0 -ErrorAction Ignore }
            if ($r.preload) { $env:VXE_DIAG_PRELOAD = $r.preload } else { Remove-Item Env:VXE_DIAG_PRELOAD -ErrorAction Ignore }
            $sw = [Diagnostics.Stopwatch]::StartNew()
            $p = Start-Process -FilePath $exe -ArgumentList $r.args -NoNewWindow -PassThru `
              -RedirectStandardOutput diag-out.txt -RedirectStandardError diag-err.txt
            $null = $p.Handle
            if ($p.WaitForExit(180000)) {
              $p.WaitForExit()
              Write-Host "=== exited with $($p.ExitCode) after $([int]$sw.Elapsed.TotalSeconds) s"
            } else {
              $p.Kill($true)
              $p.WaitForExit()
              Write-Host "=== KILLED after $([int]$sw.Elapsed.TotalSeconds) s"
            }
            Write-Host "--- stdout"; Get-Content diag-out.txt
            Write-Host "--- stderr"; Get-Content diag-err.txt
          }
          Remove-Item diag-out.txt, diag-err.txt
      # The gate tier (.config/nextest.toml): every test but the soak list, which soak.yml runs
      # weekly. The `ci` profile runs the gate tier's tests with the GPU tests in parallel.
      # On Linux a missing lavapipe fails the golden tests instead of skipping them.
      # Per-test times go to a log, so the budget step below can read them.
      - name: Gate tier
        timeout-minutes: 45
        shell: bash
        run: |
          set -o pipefail
          cargo nextest run --workspace --profile ci --status-level pass 2>&1 | tee target/nextest-gate.log
        env:
          VXE_REQUIRE_SOFTWARE_ADAPTER: ${{ runner.os == 'Linux' && '1' || '' }}
      # docs/nfr.md section 7: no gate test over 60 s on this arm. A test over the line is a
      # warning annotation, not a failure: the GPU tests run in parallel on four cores, so one
      # test's time moves 25 to 40 % between runs (runs 42470428595 and 42477325818) and a hard
      # line flips on its neighbours. A test that stays over moves to the soak list in
      # .config/nextest.toml by hand. A missing or unreadable log still fails the step.
      - name: Gate test times against the budget
        if: runner.os == 'Linux'
        shell: bash
        run: |
          status=0
          node scripts/test-times.mjs target/nextest-gate.log --over 60 > target/test-times.txt || status=$?
          cat target/test-times.txt
          if [ "$status" -eq 1 ]; then
            grep -- '-> over the' target/test-times.txt | while read -r line; do
              echo "::warning title=Gate test over 60 s::$line"
            done
          elif [ "$status" -ne 0 ]; then
            exit "$status"
          fi
      # The fly-through's `wasm` feature (off in the workspace build) hosts its logic
      # component; its tests (`tests/component.rs`) need the feature and the built component.
      # Every other fly-through test ran in the workspace step, so only that binary runs here.
      - run: cargo nextest run -p flythrough --features wasm --profile ci -E 'binary(component)'
        env:
          VXE_REQUIRE_SOFTWARE_ADAPTER: ${{ runner.os == 'Linux' && '1' || '' }}
      - run: cargo test --workspace --doc
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy -p flythrough --features wasm --all-targets -- -D warnings
      # The logic components build for wasm32-wasip2 only, which the workspace clippy does
      # not check: every guest crate under crates/vxe-script-wasm/guests/, and the
      # fly-through's logic as a component.
      - name: Clippy on the logic components
        shell: bash
        run: |
          packages=()
          for manifest in crates/vxe-script-wasm/guests/*/Cargo.toml; do
            packages+=(-p "$(sed -n 's/^name *= *"\(.*\)"/\1/p' "$manifest" | head -n 1)")
          done
          cargo clippy "${packages[@]}" --target wasm32-wasip2 -- -D warnings
          cargo clippy -p flythrough-logic --features component --target wasm32-wasip2 \
            -- -D warnings
      - run: cargo fmt --all --check
      - name: Hook bite tests
        run: node --test ".claude/hooks/*.test.mjs"
      - name: Doc links
        run: node scripts/check-doc-links.mjs
      - name: Comment hygiene
        run: node scripts/check-comment-hygiene.mjs
      - name: Index rows
        run: node scripts/check-index-rows.mjs
      - name: Index rows self-test
        run: node scripts/check-index-rows.mjs --self-test
      - name: Test tiers
        run: node scripts/check-test-tiers.mjs
      - name: Plan size
        run: node scripts/check-plan-size.mjs

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
