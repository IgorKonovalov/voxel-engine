# Build, tests, doctests, clippy, fmt and the supply-chain gate on Linux and
# Windows for every push. GPU tests run on the Linux arm only, on a software
# Vulkan adapter (Mesa's lavapipe), where golden baselines are blessed;
# VXE_REQUIRE_SOFTWARE_ADAPTER=1 fails them if lavapipe is missing. The
# Windows arm runs the CPU tests and DX12 pipeline creation on WARP.
# Real-vendor GPU checks stay manual (docs/nfr.md).
name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # A hung step fails the job instead of holding the runner for six hours. Warm, the Linux
    # job took 13 min and the Windows one 26 (CI run 41886647253); the cap leaves room for a
    # cold cache. The gate step has its own cap below, and nextest's ci profile kills a single
    # test at 600 s.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      # winit's Wayland and X11 backends need the xkbcommon and wayland headers;
      # mesa-vulkan-drivers carries lavapipe, without which wgpu finds no adapter;
      # libasound2-dev is the ALSA library cpal's Linux backend links; libudev-dev is the
      # udev library gilrs links for the fly-through's gamepad.
      - name: Install the Linux build packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libxkbcommon-dev libwayland-dev mesa-vulkan-drivers libasound2-dev libudev-dev
      # Lavapipe from the pinned Mesa release; the runner's own Mesa 26.0.8 crashes the light
      # pass. The action names the pin and why.
      - name: Build or restore the pinned lavapipe
        if: runner.os == 'Linux'
        uses: ./.github/actions/lavapipe
      # rustup on the runner auto-installs the toolchain pinned in rust-toolchain.toml.
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      # The logic components (ADR-0010) are built for wasm32-wasip2 before the tests that
      # load them; the host's tests fail, not skip, when one is missing.
      - run: rustup target add wasm32-wasip2
      - name: Build the logic components
        shell: bash
        run: scripts/build-guests.sh
      - run: cargo build --workspace
      # The tester's system report (Plan 0068): on the Windows arm its readers (RtlGetVersion,
      # the registry, GlobalMemoryStatusEx) run on a real Windows. The file is printed.
      - name: The tester's system report
        shell: bash
        run: |
          target/debug/vxe-tester --system-json target/system.json > /dev/null
          cat target/system.json
      # Pipeline creation per compute pass (docs/nfr.md section 7). Windows runs DX12 on WARP
      # twice: FXC forced through WGPU_DX12_COMPILER, then the default (static DXC,
      # ADR-0035). The fly-through's size is the debug binary the build step above produced;
      # the static DXC library's size is what the feature adds to it at most.
      - name: Pipeline times on DX12 under FXC and the default compiler
        if: runner.os == 'Windows'
        shell: bash
        run: |
          WGPU_DX12_COMPILER=fxc cargo run -p vxe-render --release --example pipeline_times
          cargo run -p vxe-render --release --example pipeline_times
          echo "target/debug/flythrough.exe: $(wc -c < target/debug/flythrough.exe) bytes"
          find target/debug/build -path '*mach-dxcompiler-rs-*' -name '*.lib' -exec wc -c {} + || true
      - name: Pipeline times on lavapipe
        if: runner.os == 'Linux'
        run: cargo run -p vxe-render --release --example pipeline_times
      # The gate tier (.config/nextest.toml): every test but the soak-marked ones, which soak.yml runs
      # weekly. The `ci` profile runs the gate tier's tests with the GPU tests in parallel.
      # On Linux a missing lavapipe fails the golden tests instead of skipping them.
      # Per-test times go to a log, so the budget step below can read them.
      - name: Gate tier
        timeout-minutes: 45
        shell: bash
        run: |
          set -o pipefail
          cargo nextest run --workspace --profile "$GATE_PROFILE" --status-level pass 2>&1 | tee target/nextest-gate.log
        env:
          VXE_REQUIRE_SOFTWARE_ADAPTER: ${{ runner.os == 'Linux' && '1' || '' }}
          # Windows runs the CPU tests only (.config/nextest.toml, ci-windows).
          GATE_PROFILE: ${{ runner.os == 'Windows' && 'ci-windows' || 'ci' }}
      # docs/nfr.md section 7: no gate test over 60 s on this arm. A test over the line is a
      # warning annotation, not a failure: the GPU tests run in parallel on four cores, so one
      # test's time moves 25 to 40 % between runs (runs 42470428595 and 42477325818) and a hard
      # line flips on its neighbours. A test that stays over is marked
      # `#[ignore = "soak"]` by hand. A missing or unreadable log still fails the step.
      - name: Gate test times against the budget
        if: runner.os == 'Linux'
        shell: bash
        run: |
          status=0
          node scripts/test-times.mjs target/nextest-gate.log --over 60 > target/test-times.txt || status=$?
          cat target/test-times.txt
          if [ "$status" -eq 1 ]; then
            grep -- '-> over the' target/test-times.txt | while read -r line; do
              echo "::warning title=Gate test over 60 s::$line"
            done
          elif [ "$status" -ne 0 ]; then
            exit "$status"
          fi
      # The fly-through's `wasm` feature (off in the workspace build) hosts its logic
      # component; its tests (`tests/component.rs`) need the feature and the built component.
      # Every other fly-through test ran in the workspace step, so only that binary runs here.
      - run: cargo nextest run -p flythrough --features wasm --profile ci -E 'binary(component)'
        env:
          VXE_REQUIRE_SOFTWARE_ADAPTER: ${{ runner.os == 'Linux' && '1' || '' }}
      - run: cargo test --workspace --doc
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy -p flythrough --features wasm --all-targets -- -D warnings
      # The logic components build for wasm32-wasip2 only, which the workspace clippy does
      # not check: every guest crate under crates/vxe-script-wasm/guests/, and the
      # fly-through's logic as a component.
      - name: Clippy on the logic components
        shell: bash
        run: |
          packages=()
          for manifest in crates/vxe-script-wasm/guests/*/Cargo.toml; do
            packages+=(-p "$(sed -n 's/^name *= *"\(.*\)"/\1/p' "$manifest" | head -n 1)")
          done
          cargo clippy "${packages[@]}" --target wasm32-wasip2 -- -D warnings
          cargo clippy -p flythrough-logic --features component --target wasm32-wasip2 \
            -- -D warnings
      - run: cargo fmt --all --check
      - name: Hook bite tests
        run: node --test ".claude/hooks/*.test.mjs"
      - name: Doc links
        run: node scripts/check-doc-links.mjs
      - name: Comment hygiene
        run: node scripts/check-comment-hygiene.mjs
      - name: Index rows
        run: node scripts/check-index-rows.mjs
      - name: Index rows self-test
        run: node scripts/check-index-rows.mjs --self-test
      - name: Test tiers
        run: node scripts/check-test-tiers.mjs
      - name: File size
        run: node scripts/check-file-size.mjs
      - name: Plan size
        run: node scripts/check-plan-size.mjs

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
