# The tester build (Plan 0068, ADR-0054): the launcher and the release fly-through for Linux and
# Windows x86_64, each archive unpacked fresh and its binaries started before it is kept. A
# `v*` tag attaches both archives to a GitHub Release; a manual run (workflow_dispatch) uploads
# them as the run's artifacts only.
#
# Linux builds on the oldest Ubuntu image GitHub offers, so the glibc floor is as low as the
# runners allow; the floor is printed and written into the archive's README. Its archive is
# checked on ubuntu-latest, whose Mesa the pinned lavapipe action builds against (the old image
# has no LLVM 21). The notices are generated by cargo-about, pinned and installed here only.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_ABOUT_VERSION: "0.9.3"

jobs:
  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    outputs:
      archive: ${{ steps.pack.outputs.archive }}
    steps:
      - uses: actions/checkout@v5
      - name: Install the Linux build packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libxkbcommon-dev libwayland-dev libasound2-dev libudev-dev
      - uses: Swatinem/rust-cache@v2
        with:
          key: release
      - name: Build the release binaries
        env:
          VXE_COMMIT: ${{ github.sha }}
        run: |
          start=$(date +%s)
          cargo build --release --locked -p vxe-tester -p flythrough
          echo "release build: $(( $(date +%s) - start )) s"
      - name: Generate the third-party notices
        run: |
          cargo install --locked --features cli "cargo-about@$CARGO_ABOUT_VERSION"
          cargo about generate --manifest-path apps/tester/Cargo.toml -c dist/about.toml \
            dist/about.hbs -o target/THIRD-PARTY-NOTICES.txt
      - name: Pack the archive
        id: pack
        env:
          VXE_COMMIT: ${{ github.sha }}
        run: |
          archive=$(scripts/package-tester.sh linux target/dist target/THIRD-PARTY-NOTICES.txt | tail -n 1)
          echo "archive=$(basename "$archive")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: vxe-tester-linux-x86_64
          path: target/dist/*.tar.gz
          if-no-files-found: error

  linux-check:
    needs: linux
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      # The runtime libraries the binaries link, and the pinned lavapipe, so the adapter list
      # is not empty.
      - name: Install the runtime packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libvulkan1 libasound2t64 libudev1 binutils
      - name: Build or restore the pinned lavapipe
        uses: ./.github/actions/lavapipe
      - uses: actions/download-artifact@v4
        with:
          name: vxe-tester-linux-x86_64
          path: dl
      - name: Unpack fresh and start both binaries
        run: |
          fresh=$(mktemp -d)
          tar -xzf "dl/${{ needs.linux.outputs.archive }}" -C "$fresh"
          cd "$fresh"/vxe-tester-*
          ls -l
          ./vxe-tester --system-json system.json > /dev/null
          cat system.json
          grep -q '"name"' system.json
          ./flythrough --check-args --tester --path cave
          echo "glibc floor: $(objdump -T vxe-tester flythrough | grep -o 'GLIBC_[0-9][0-9.]*' | sort -uV | tail -n 1)"
          grep -n "glibc" README-TESTER.txt

  windows:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
        with:
          key: release
      - name: Build the release binaries
        shell: bash
        env:
          VXE_COMMIT: ${{ github.sha }}
        run: |
          start=$(date +%s)
          cargo build --release --locked -p vxe-tester -p flythrough
          echo "release build: $(( $(date +%s) - start )) s"
      - name: Generate the third-party notices, with DXC's
        shell: bash
        run: |
          cargo install --locked --features cli "cargo-about@$CARGO_ABOUT_VERSION"
          cargo about generate --manifest-path apps/tester/Cargo.toml -c dist/about.toml \
            dist/about.hbs -o target/THIRD-PARTY-NOTICES.txt
          {
            printf '\n================================================================================\n'
            printf 'DirectXShaderCompiler (University of Illinois/NCSA), statically linked into\n'
            printf "the DirectX 12 backend through mach-dxcompiler-rs (ADR-0035)\n\n"
            cat dist/DXC-LICENSE.txt
          } >> target/THIRD-PARTY-NOTICES.txt
      - name: Pack the archive
        shell: bash
        env:
          VXE_COMMIT: ${{ github.sha }}
        run: scripts/package-tester.sh windows target/dist target/THIRD-PARTY-NOTICES.txt
      - name: Unpack fresh and start both binaries
        shell: bash
        run: |
          fresh=$(mktemp -d)
          7z x -bd -o"$fresh" target/dist/*.zip > /dev/null
          cd "$fresh"/vxe-tester-*
          ls -l
          ./vxe-tester.exe --system-json system.json > /dev/null
          cat system.json
          ./flythrough.exe --check-args --tester --path cave
      - uses: actions/upload-artifact@v4
        with:
          name: vxe-tester-windows-x86_64
          path: target/dist/*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, linux-check, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dl
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dl/* --repo "$GITHUB_REPOSITORY" \
            --title "vxe-tester $GITHUB_REF_NAME" \
            --notes "The tester build: unpack, run vxe-tester, read README-TESTER.txt."
