[package]
name = "vxe-tester"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "The tester build's launcher: runs the fly-through per scene and packs a report"
publish = false

[lints]
workspace = true

[lib]
name = "vxe_tester"
path = "src/lib.rs"

[[bin]]
name = "vxe-tester"
path = "src/main.rs"

[dependencies]
crc32fast.workspace = true
env_logger.workspace = true
flythrough = { path = "../flythrough" }
log.workspace = true
vxe-app.workspace = true
vxe-render.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true
