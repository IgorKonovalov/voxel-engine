[package]
name = "flythrough"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "The engine's own testbed: fly through a streaming voxel world and dig"
publish = false

[lints]
workspace = true

[features]
# `--logic wasm`: hosts the logic component on `wasmtime` (`vxe-script-wasm`). Off by default,
# so the everyday build does not compile `wasmtime`.
wasm = ["dep:vxe-script-wasm"]

[dependencies]
env_logger.workspace = true
log.workspace = true
vxe-world = { path = "../../crates/vxe-world" }
vxe-net = { path = "../../crates/vxe-net" }
vxe-sim = { path = "../../crates/vxe-sim" }
vxe-render = { path = "../../crates/vxe-render" }
vxe-app = { path = "../../crates/vxe-app" }
flythrough-logic = { path = "logic" }
vxe-script-wasm = { workspace = true, features = ["host"], optional = true }

[dev-dependencies]
png.workspace = true
pollster.workspace = true

[[test]]
name = "component"
required-features = ["wasm"]
