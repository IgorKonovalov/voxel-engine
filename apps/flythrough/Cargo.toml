[package]
name = "flythrough"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "The engine's own testbed: fly through a streaming voxel world and dig"
publish = false

[lints]
workspace = true

[features]
# `--logic wasm`: hosts the logic component on `wasmtime` (`vxe-script-wasm`). Off by default,
# so the everyday build does not compile `wasmtime`.
wasm = ["dep:vxe-script-wasm"]

[dependencies]
env_logger.workspace = true
gilrs.workspace = true
log.workspace = true
vxe-world.workspace = true
vxe-net.workspace = true
vxe-sim.workspace = true
vxe-render.workspace = true
vxe-app.workspace = true
flythrough-logic = { path = "logic" }
vxe-script-wasm = { workspace = true, features = ["host"], optional = true }
vxe-audio.workspace = true
vxe-assets.workspace = true

[dev-dependencies]
criterion.workspace = true
png.workspace = true
pollster.workspace = true

[[test]]
name = "component"
required-features = ["wasm"]

[[bench]]
name = "acoustics"
harness = false

# The hero still's argument tests run with the rest of the testbed's.
[[example]]
name = "hero"
test = true
