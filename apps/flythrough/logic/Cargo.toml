[package]
name = "flythrough-logic"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "The fly-through's server logic, native or as a WebAssembly component"
publish = false

[lints]
workspace = true

[features]
# Exports the `logic` world for `DigLogic` (ADR-0010). The crate is an rlib for the native
# build; `scripts/build-guests.sh` builds the component from it as a `cdylib` for
# `wasm32-wasip2` with this feature (`cargo rustc --crate-type cdylib`), so the native build
# links no second artifact.
component = ["dep:vxe-script-wasm"]

[dependencies]
vxe-net.workspace = true
vxe-world.workspace = true
vxe-script-wasm = { workspace = true, features = ["guest"], optional = true }
