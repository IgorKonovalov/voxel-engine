# Determinism gate (CLAUDE.md "The world is headless and deterministic"): the
# world crate, the server and its tick in vxe-net, and anything the server runs
# are pure functions of their inputs.
# No wall-clock reads and no unseeded RNG. clippy config is per-run, not
# per-crate, so the ban is global; the app shell's frame pacing reads carry a
# grep-able #[allow(clippy::disallowed_methods, reason = "...")].
#
# rand::random / rand::rng join this list when `rand` becomes a dependency;
# unresolved paths are skipped, so they are added with rand, not now.
disallowed-methods = [
    { path = "std::time::Instant::now", reason = "no wall-clock in simulation; take time from the caller (determinism)" },
    { path = "std::time::Instant::elapsed", reason = "no wall-clock in simulation; take time from the caller (determinism)" },
    { path = "std::time::SystemTime::now", reason = "no wall-clock in simulation; take time from the caller (determinism)" },
]

allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
