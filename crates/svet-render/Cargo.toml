# this crate's tests and the tests of crates that render.
test-support = ["dep:pollster"]

[dependencies]
bytemuck.workspace = true
glam.workspace = true
pollster = { workspace = true, optional = true }
svet-entity.workspace = true
svet-world.workspace = true
wgpu.workspace = true

[dev-dependencies]
log.workspace = true
pollster.workspace = true
png.workspace = true
svet-render = { workspace = true, features = ["test-support"] }
criterion.workspace = true
