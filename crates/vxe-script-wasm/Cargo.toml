[package]
name = "vxe-script-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "A WebAssembly component host for the game's logic, configured to be deterministic"

[lints]
workspace = true

[features]
default = ["host"]
# The host: `WasmLogic` on `wasmtime`.
host = ["dep:wasmtime", "dep:wasmtime-wasi", "dep:rand_core"]
# The guest side: the WIT world's bindings and `export_logic!`, for a logic crate built as a
# component. A guest depends on this crate without default features.
guest = ["dep:wit-bindgen"]

[dependencies]
vxe-net.workspace = true
vxe-world.workspace = true
rand_core = { workspace = true, optional = true }
wasmtime = { workspace = true, optional = true }
wasmtime-wasi = { workspace = true, optional = true }
wit-bindgen = { workspace = true, optional = true }

[dev-dependencies]
vxe-net = { workspace = true, features = ["test-logic"] }
criterion.workspace = true
# The fly-through's `DigLogic`, native, against its component in the boundary bench.
flythrough-logic = { path = "../../apps/flythrough/logic" }

[[bench]]
name = "boundary"
harness = false
