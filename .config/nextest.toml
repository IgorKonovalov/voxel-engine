# Test tiers (Plan 0043; re-cut 2026-11-03 for iteration speed; selected by marks since
# 2026-11-10). One classification, these profiles:
#
#   cargo nextest run --profile quick    CPU-only tests minus soak; no perf lock, no GPU
#   cargo nextest run --profile gpu      the GPU tests minus soak; under the perf lock
#   cargo nextest run --profile gate     quick + gpu, everything but soak: a plan's tip, the close
#                                        review, CI's push run (as `ci`)
#   cargo nextest run --profile soak --run-ignored only
#                                        the long series only; on request, and CI's weekly run
#                                        (as `ci-soak`). Not part of any gate
#   cargo nextest run --profile full --run-ignored all
#                                        everything but the readings; only when the owner asks
#   cargo nextest run --profile ci       the gate tier with the GPU tests in parallel; CI only
#   cargo nextest run --profile ci-soak --run-ignored only
#                                        the soak tier with the GPU tests in parallel; CI only
#
# A dev phase runs `node scripts/test-changed.mjs --profile quick` (and `--profile gpu` under the
# perf lock when the change reaches the renderer): the tier narrowed to the crates the working
# tree changed and their dependents. A bare `cargo nextest run` is the gate tier.
#
# The tests carry their own marks; no profile lists a test:
#
# GPU      every test binary named `gpu_*` (`tests/gpu_*.rs`): `binary(/^gpu_/)`, and
#          `not binary(/^gpu_/)` for the CPU tests.
# SOAK     every test over the line in docs/nfr.md section 7 (60 s on CI's Linux arm, or 30 s on
#          the dev reference's lavapipe, quiet) is `#[ignore = "soak"]`. Only `--run-ignored`
#          reaches it, which a profile cannot set, so the soak and full commands above pass it.
#          `node scripts/test-times.mjs <log>` ranks a run's tests by time and names the ones
#          over the line; a run logs per-test times with `--status-level pass`.
# READING  a measurement run by hand (it prints numbers and asserts nothing a tier runs) is
#          `#[ignore]`d inside a `mod reading`; soak and full leave out
#          `test(/(^|::)reading::/)`. Run one with
#          `cargo nextest run -p <package> --run-ignored only -E 'test(=reading::<name>)'`.
#
# `node scripts/check-test-tiers.mjs` fails when a test file that reaches a device lacks the
# prefix, when an `#[ignore]` is neither "soak" nor inside `mod reading`, or when a profile
# below drifts from these forms.

# One lavapipe process already spreads over every core, so two at once only contend on a
# shared dev box. The `ci` profiles lift the cap on a dedicated runner.
[test-groups]
lavapipe = { max-threads = 1 }

[profile.default]
default-filter = 'all()'
slow-timeout = { period = "30s" }

# GPU: the gpu tests share one lavapipe at a time.
[[profile.default.overrides]]
filter = 'binary(/^gpu_/)'
test-group = 'lavapipe'

[profile.quick]
default-filter = 'not binary(/^gpu_/)'
# A test past 30 s is killed: the fix is the soak mark, not a longer timeout.
slow-timeout = { period = "10s", terminate-after = 3 }

[profile.gpu]
default-filter = 'binary(/^gpu_/)'
slow-timeout = { period = "30s" }

[profile.gate]
slow-timeout = { period = "30s" }

# A long series is flagged at 600 s rather than 30 s.
[profile.soak]
default-filter = 'not test(/(^|::)reading::/)'
slow-timeout = { period = "600s" }

[profile.full]
default-filter = 'not test(/(^|::)reading::/)'
slow-timeout = { period = "30s" }

# The gate tier for CI. It inherits `gate`'s tests and moves every test out of the `lavapipe`
# group into nextest's `@global` group: a profile's own overrides win over the default
# profile's, setting by setting. A dedicated runner has no other lane to crowd, and serialising
# the GPU tests there roughly doubles the Linux test step.
#
# A test still running at 600 s is killed and fails by name, so a hang or a runaway slows one
# test, not the job: ten times the 60 s line, over the slowest gate test either arm has read
# (238 s on Windows' WARP, CI run 41886647253). Set in the override because a profile's
# overrides outrank every profile-level setting.
[profile.ci]
inherits = "gate"

[[profile.ci.overrides]]
filter = 'all()'
test-group = '@global'
slow-timeout = { period = "60s", terminate-after = 10 }

# The gate tier for CI's Windows arm: the CPU tests only, the quick tier's filter. On WARP,
# frame 0's `shade_preload` hangs once anything touches its buffers between the preload's
# args pass and it, and only the D3D12 debug layer clears that (docs/backlog.md,
# "`vxe-render::exposure` hangs on WARP since Plan 0057 Phase 7", the binary now
# `vxe-render::gpu_exposure`). No GPU test runs on Windows until Plan 0059 settles the preload
# (owner, 2026-11-09). `node scripts/check-test-tiers.mjs` checks the copy.
[profile.ci-windows]
inherits = "ci"
default-filter = 'not binary(/^gpu_/)'

# The soak tier for CI's weekly run (.github/workflows/soak.yml), GPU tests in parallel as above.
[profile.ci-soak]
inherits = "soak"

[[profile.ci-soak.overrides]]
filter = 'all()'
test-group = '@global'
