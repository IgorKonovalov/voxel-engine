# Test tiers (Plan 0043; re-cut 2026-11-03 for iteration speed). One classification, these profiles:
#
#   cargo nextest run --profile quick    CPU-only tests minus the soak list; no perf lock, no GPU
#   cargo nextest run --profile gpu      the GPU tests minus the soak list; under the perf lock
#   cargo nextest run --profile gate     quick + gpu, everything but soak: a plan's tip, the close
#                                        review, CI's push run (as `ci`)
#   cargo nextest run --profile soak     the long series only; on request, and CI's weekly run (as
#                                        `ci-soak`). Not part of any gate
#   cargo nextest run --profile full     everything; optional, only when the owner asks
#   cargo nextest run --profile ci       the gate tier with the GPU tests in parallel; CI only
#   cargo nextest run --profile ci-soak  the soak tier with the GPU tests in parallel; CI only
#
# A dev phase runs `node scripts/test-changed.mjs --profile quick` (and `--profile gpu` under the
# perf lock when the change reaches the renderer): the tier narrowed to the crates the working
# tree changed and their dependents. A bare `cargo nextest run` is the default profile, which is
# the full suite.
#
# The classification is two expressions, written out in full wherever a profile needs them,
# because nextest has no filter aliases:
#
# GPU  every test that reaches a GPU device. The lavapipe override's filter below is the one
#      canonical copy; `quick` and `gpu` repeat it verbatim, and
#      `node scripts/check-test-tiers.mjs` fails when the copies differ, when a test file that
#      reaches a device is not matched by it, or when an entry matches no file.
#
# SOAK every test over the line in docs/nfr.md section 7 (60 s on CI's Linux arm, or 30 s on the
#      dev reference's lavapipe, quiet), by binary and full name. The `soak` override's filter
#      below is the canonical copy; `quick`, `gpu`, `gate` and `soak` repeat it verbatim and the
#      same gate checks the copies. `node scripts/test-times.mjs <log>` ranks a run's tests by
#      time and names the ones over the line; a run logs per-test times with
#      `--status-level pass`. The list was cut from CI run 41332396750 on 929d1b3 (2026-11-01).

# One lavapipe process already spreads over every core, so two at once only contend on a
# shared dev box. The `ci` profiles lift the cap on a dedicated runner.
[test-groups]
lavapipe = { max-threads = 1 }

[profile.default]
default-filter = 'all()'
slow-timeout = { period = "30s" }

# GPU: the canonical copy of the gpu filter.
[[profile.default.overrides]]
filter = '(package(vxe-render) - kind(lib)) | binary_id(flythrough::cutaway) | binary_id(flythrough::emissive_stillness) | binary_id(flythrough::exposure) | binary_id(flythrough::castle_golden) | binary_id(flythrough::fsr2) | binary_id(flythrough::golden) | binary_id(flythrough::hud_golden) | binary_id(flythrough::indirect) | binary_id(flythrough::level_mirror) | binary_id(flythrough::lights) | binary_id(flythrough::look) | binary_id(flythrough::shutdown) | binary_id(flythrough::strip) | binary_id(flythrough::upscale)'
test-group = 'lavapipe'

# SOAK: the canonical copy of the soak list. Its own effect is a quieter report: a long series
# is flagged at 600 s rather than 30 s.
[[profile.default.overrides]]
filter = '(binary_id(flythrough::emissive_stillness) & (test(=the_vein_wall_holds_still_with_the_lamp_off) | test(=the_vein_wall_patches_are_counted))) | (binary_id(flythrough::exposure) & (test(=the_caves_curve_after_the_lamp_goes_off) | test(=the_curve_facing_a_vein_follows_the_stepped_model))) | (binary_id(flythrough::fsr2) & (test(=a_carve_leaves_no_ghost_under_fsr2) | test(=a_still_camera_under_our_upscaler_is_nearer_the_linear_supersampled_render_than_a_blit) | test(=fsr2_at_scale_1_5_moves_shadows_no_more_than_ours_on_a_still_camera) | test(=fsr2_at_scale_1_keeps_stripe_edges_sharp_at_arms_length) | test(=fsr2_keeps_its_still_sharpness_on_a_whole_pixel_pan) | test(=fsr2_keeps_pace_with_a_sweeping_headlamp_and_a_lamp_step) | test(=fsr2_pan_per_pass_readings) | test(=fsr2_upscales_the_stripe_wall_sharper_than_a_bilinear_blit) | test(=fsr2_wobble_per_pass_readings) | test(=the_reactive_mask_marks_edits_light_changes_and_translucency))) | (binary_id(flythrough::golden) & (test(=fsr2_carries_the_indirect_golden_s_bounce_light) | test(=indirect_golden_shows_the_vein_s_bounce_light) | test(=showcase_hall_golden_is_lit_by_its_four_ores))) | (binary_id(flythrough::indirect) & (test(=a_hole_in_the_wall_lights_the_dark_box_and_filling_it_darkens_it_again) | test(=an_emission_step_drops_the_probe_history) | test(=a_pulse_at_its_mean_leaves_the_probes_still) | test(=no_light_change_opens_no_window) | test(=no_light_leaks_through_a_two_voxel_wall) | test(=switching_the_lamp_off_drops_the_probe_history) | test(=the_furnace_box_reads_pi_of_indirect_irradiance))) | (binary_id(flythrough::level_mirror) & (test(=band_census))) | (binary_id(flythrough::lights) & (test(=a_moving_lamp_leaves_the_static_lights_history_alone) | test(=a_reveal_behind_a_plug_follows_within_seventy_three_frames) | test(=reservoir_reuse_lowers_one_frames_error) | test(=static_emissive_light_holds_still) | test(=the_emissive_guard_keeps_history_where_nothing_changed) | test(=the_lamp_light_that_left_the_cone_drops_in_each_history_mode))) | (binary_id(flythrough::look) & (test(=a_smooth_surface_meets_a_crisp_cube_without_a_gap) | test(=every_mode) | test(=the_default_look_reads_the_same_hit_records_with_and_without_band_slots) | test(=the_field_look_has_no_boxes_and_no_leaks) | test(=the_field_surface_has_no_boxes_and_no_leaks) | test(=thin_features_in_the_field_and_per_material))) | (binary_id(flythrough::upscale) & (test(=a_still_camera_upscales_nearer_the_supersampled_render_than_the_bilinear_blit) | test(=a_sweeping_headlamp_and_a_lamp_step_keep_pace_with_plan_0024s_frame) | test(=the_upscaler_keeps_stripe_edges_sharp_still_and_panning))) | (binary_id(vxe-world::stamp) & (test(=stamp_tally_agrees_with_apply_on_random_boxes)))'
slow-timeout = { period = "600s" }

