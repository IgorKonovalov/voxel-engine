default-filter = 'all()'
slow-timeout = { period = "30s" }

# The gate tier for CI. It inherits `gate`'s filter, so it runs the same tests, and moves every
# test out of the `lavapipe` group into nextest's `@global` group: a profile's own overrides
# win over the default profile's, setting by setting, so the soak list's timeout still applies.
# A dedicated runner has no other lane to crowd, and serialising the GPU tests there roughly
# doubles the Linux test step.
#
# A test still running at 600 s is killed and fails by name, so a hang or a runaway slows one
# test, not the job: ten times the 60 s line, over the slowest gate test either arm has read
# (238 s on Windows' WARP, CI run 41886647253). Set in the override because a profile's
# overrides outrank every profile-level setting.
[profile.ci]
inherits = "gate"

[[profile.ci.overrides]]
filter = 'all()'
test-group = '@global'
slow-timeout = { period = "60s", terminate-after = 10 }

# The gate tier for CI's Windows arm: the CPU tests only, the quick tier's filter. On WARP,
# frame 0's `shade_preload` hangs once anything touches its buffers between the preload's
# args pass and it, and only the D3D12 debug layer clears that (docs/backlog.md,
# "`vxe-render::exposure` hangs on WARP since Plan 0057 Phase 7"). No GPU test runs on
# Windows until Plan 0059 settles the preload (owner, 2026-11-09).
# `node scripts/check-test-tiers.mjs` checks the copy.
[profile.ci-windows]
inherits = "ci"
default-filter = 'not ((package(vxe-render) - kind(lib)) | binary_id(flythrough::cutaway) | binary_id(flythrough::emissive_stillness) | binary_id(flythrough::exposure) | binary_id(flythrough::castle_golden) | binary_id(flythrough::fsr2) | binary_id(flythrough::golden) | binary_id(flythrough::hud_golden) | binary_id(flythrough::indirect) | binary_id(flythrough::level_mirror) | binary_id(flythrough::lights) | binary_id(flythrough::look) | binary_id(flythrough::settle) | binary_id(flythrough::shutdown) | binary_id(flythrough::strip) | binary_id(flythrough::upscale)) and not ((binary_id(flythrough::emissive_stillness) & (test(=the_vein_wall_holds_still_with_the_lamp_off) | test(=the_vein_wall_patches_are_counted))) | (binary_id(flythrough::exposure) & (test(=the_caves_curve_after_the_lamp_goes_off) | test(=the_curve_facing_a_vein_follows_the_stepped_model))) | (binary_id(flythrough::fsr2) & (test(=a_carve_leaves_no_ghost_under_fsr2) | test(=doubling_the_exposure_reaches_fsr_the_same_frame) | test(=a_still_camera_under_our_upscaler_is_nearer_the_linear_supersampled_render_than_a_blit) | test(=fsr2_at_scale_1_5_moves_shadows_no_more_than_ours_on_a_still_camera) | test(=fsr2_at_scale_1_keeps_stripe_edges_sharp_at_arms_length) | test(=fsr2_keeps_its_still_sharpness_on_a_whole_pixel_pan) | test(=fsr2_keeps_pace_with_a_sweeping_headlamp_and_a_lamp_step) | test(=fsr2_pan_per_pass_readings) | test(=fsr2_upscales_the_stripe_wall_sharper_than_a_bilinear_blit) | test(=fsr2_wobble_per_pass_readings) | test(=the_reactive_mask_marks_edits_light_changes_and_translucency) | test(=the_tone_pass_reproduces_the_composites_bytes_on_every_golden_pose))) | (binary_id(flythrough::golden) & (test(=showcase_hall_golden_is_lit_by_its_four_ores))) | (binary_id(flythrough::indirect) & (test(=a_hole_in_the_wall_lights_the_dark_box_and_filling_it_darkens_it_again) | test(=no_light_change_opens_no_window) | test(=no_light_leaks_through_a_two_voxel_wall) | test(=switching_the_lamp_off_drops_the_probe_history) | test(=the_lamp_furnace_reads_its_albedo_times_the_direct_mean))) | (binary_id(flythrough::level_mirror) & (test(=band_census))) | (binary_id(flythrough::lights) & (test(=a_moving_lamp_leaves_the_static_lights_history_alone) | test(=a_reveal_behind_a_plug_follows_within_seventy_three_frames) | test(=the_lamp_light_that_left_the_cone_drops_in_each_history_mode))) | binary_id(flythrough::settle) | (binary_id(flythrough::look) & (test(=a_smooth_surface_meets_a_crisp_cube_without_a_gap) | test(=every_mode) | test(=the_default_look_reads_the_same_hit_records_with_and_without_band_slots) | test(=the_field_look_has_no_boxes_and_no_leaks) | test(=the_field_surface_has_no_boxes_and_no_leaks) | test(=the_field_surface_lies_on_the_flat_faces) | test(=thin_features_in_the_field_and_per_material))) | (binary_id(flythrough::replay) & (test(=a_stamp_and_a_collapse_replay_from_the_save))) | (binary_id(flythrough::upscale) & (test(=a_carve_in_view_leaves_no_ghost_in_its_box) | test(=a_still_camera_upscales_nearer_the_supersampled_render_than_the_bilinear_blit) | test(=a_sweeping_headlamp_and_a_lamp_step_keep_pace_with_plan_0024s_frame) | test(=temporal_age_under_the_jitter) | test(=the_upscaler_keeps_stripe_edges_sharp_still_and_panning))) | (binary_id(vxe-render::walk) & (test(=a_corner_tie_ray_hits_the_same_voxel_through_the_same_face_with_and_without_skips))) | (binary_id(vxe-world::stamp) & (test(=stamp_tally_agrees_with_apply_on_random_boxes))))'

# The soak tier for CI's weekly run (.github/workflows/soak.yml), GPU tests in parallel as above.
[profile.ci-soak]
inherits = "soak"

[[profile.ci-soak.overrides]]
filter = 'all()'
test-group = '@global'
