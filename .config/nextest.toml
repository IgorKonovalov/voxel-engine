[profile.full]
default-filter = 'all()'
slow-timeout = { period = "30s" }

# The gate tier for CI. It inherits `gate`'s filter, so it runs the same tests, and moves every
# test out of the `lavapipe` group into nextest's `@global` group: a profile's own overrides
# win over the default profile's, setting by setting, so the soak list's timeout still applies.
# A dedicated runner has no other lane to crowd, and serialising the GPU tests there roughly
# doubles the Linux test step.
[profile.ci]
inherits = "gate"

[[profile.ci.overrides]]
filter = 'all()'
test-group = '@global'

# The soak tier for CI's weekly run (.github/workflows/soak.yml), GPU tests in parallel as above.
[profile.ci-soak]
inherits = "soak"

[[profile.ci-soak.overrides]]
filter = 'all()'
test-group = '@global'
