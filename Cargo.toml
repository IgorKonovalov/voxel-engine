[workspace]
resolver = "3"
members = [
    "crates/*",
    "crates/vxe-script-wasm/guests/*",
    "apps/*",
    "apps/flythrough/logic",
]
# The everyday loop: everything but the WebAssembly host (`wasmtime` is a heavy build) and its
# guests, which `scripts/build-guests.sh` builds for `wasm32-wasip2` (ADR-0010).
default-members = [
    "crates/vxe-app",
    "crates/vxe-assets",
    "crates/vxe-audio",
    "crates/vxe-net",
    "crates/vxe-render",
    "crates/vxe-sim",
    "crates/vxe-world",
    "apps/flythrough",
    "apps/flythrough/logic",
]

[workspace.package]
# Single source of truth for the engine version. Member crates inherit it via
# `version.workspace = true`; bumped once per plan at the architect close.
version = "0.25.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/IgorKonovalov/voxel-engine"
rust-version = "1.97"

# Baseline lints shared by every workspace member (opted in with
# `lints.workspace = true`). Hot-path panic denial is a per-module pragma, not
# workspace-wide, so idiomatic test code is never fought.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "warn"
unimplemented = "warn"

[workspace.dependencies]
# Versions are pinned exactly and live here, once. A crate takes a dependency
# with `foo.workspace = true`. Nothing is listed until a plan needs it.
bytemuck = { version = "=1.25.2", features = ["derive"] }
# The audio output stream (ADR-0006): ALSA on Linux, WASAPI on Windows.
cpal = "=0.18.2"
criterion = { version = "=0.8.2", default-features = false, features = ["cargo_bench_support"] }
env_logger = { version = "=0.11.11", default-features = false }
# The probe component's entropy source: what a logic crate reaching for randomness would use.
getrandom = { version = "=0.4.3", default-features = false }
# The testbed's gamepad (ADR-0019): evdev through udev on Linux (links the system libudev),
# Windows Gaming Input on Windows. Defaults kept: without them gilrs-core 0.6.8 does not compile.
gilrs = "=0.11.2"
glam = { version = "=0.34.1", features = ["bytemuck"] }
log = "=0.4.34"
png = "=0.18.1"
pollster = "=1.0.1"
# The HRIR packer example reads SOFA with it (ADR-0006); a dev-dependency only, reading
# needs neither its renderer nor its resampler.
sofar = { version = "=0.4.0", default-features = false }
# Engine crates other engine crates depend on. The exact version tracks
# [workspace.package].version above; bump both together.
vxe-assets = { path = "crates/vxe-assets", version = "=0.25.0" }
vxe-audio = { path = "crates/vxe-audio", version = "=0.25.0" }
vxe-net = { path = "crates/vxe-net", version = "=0.25.0" }
vxe-sim = { path = "crates/vxe-sim", version = "=0.25.0" }
# Without its default `host` feature, so a guest takes only the bindings (`guest`).
vxe-script-wasm = { path = "crates/vxe-script-wasm", version = "=0.25.0", default-features = false }
vxe-world = { path = "crates/vxe-world", version = "=0.25.0" }
# The WebAssembly host for the logic component (ADR-0010) and the guest bindings. The three
# move together (wit-bindgen at the release on wasmtime's wasm-tools, 0.258): a bump is its
# own commit, gated by the native-versus-component equality test.
wasmtime = { version = "=49.0.4", default-features = false, features = ["runtime", "cranelift", "component-model", "std"] }
wasmtime-wasi = { version = "=49.0.4", default-features = false }
# The trait the WASI random interfaces take, at wasmtime-wasi's version.
rand_core = { version = "=0.10.1", default-features = false }
wit-bindgen = { version = "=0.61.1", default-features = false, features = ["macros", "realloc"] }
# The `timer` guest's direct `wasi:clocks` calls, at the version getrandom already pulls in.
wasip2 = { version = "=1.0.4", default-features = false, features = ["std"] }
# The names wasmtime-wasi's stream traits take (`Bytes`, tokio's `AsyncWrite`), at its versions.
bytes = { version = "=1.12.1", default-features = false }
tokio = { version = "=1.53.3", default-features = false }
# Only the backends we ship (ADR-0001): Vulkan on Linux and Windows, DX12 on Windows.
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "parking_lot", "vulkan", "dx12", "wgsl"] }
# Wayland and X11 on Linux without client-side decorations (the window manager draws them).
winit = { version = "=0.30.13", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen"] }

[profile.release]
# The world and the ray marcher are the hot paths; LTO and a single codegen
# unit are the usual free win for a release build.
lto = "thin"
codegen-units = 1

[profile.dev.package."*"]
# Dependencies optimized even in dev builds, so a debug fly-through is usable.
opt-level = 2

# The world crate and the testbed generate caves in tests; unoptimized, the level-size cave
# takes 52 s to generate in a test build instead of 1.7 s.
[profile.dev.package.vxe-world]
opt-level = 2

[profile.dev.package.flythrough]
opt-level = 2

# The collision tests generate six closure-source worlds and run 300-tick courses on them.
[profile.dev.package.vxe-sim]
opt-level = 2

# The mixer runs on the audio device's callback: unoptimized, one HRTF voice whose direction
# changes costs about 2.5 ms of a 5.33 ms block and the stream underruns.
[profile.dev.package.vxe-audio]
opt-level = 2
